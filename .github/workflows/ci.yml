name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: Static Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      - name: Run TypeScript typecheck
        run: npm run typecheck

  unit-tests:
    name: Client & Server Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      - name: Install Playwright for server tests
        run: npx --prefix server playwright install --with-deps chromium

      - name: Run Server Unit Tests
        run: npm run test:server

      - name: Run Client Angular Unit Tests
        run: npm run test:client

  e2e:
    name: Playwright E2E Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/quicktix_test
      JWT_SECRET: ci-only-secret-do-not-use-in-production
      TEST_PORT: 3100
      BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Build Angular Client
        run: npm run build:client

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test --grep-invert @visual

      - name: Publish Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: results/junit.xml

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            results/
          retention-days: 14

